[project]
name = "download-scielo-fulltext"
version = "0.1.0"
description = "Reproducible SciELO full-text download and typed manifests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "docgraph[parquet]>=0.2.0",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.uv.sources]
docgraph = { path = "../docgraph", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
